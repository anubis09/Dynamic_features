policy:
  initial_exp_rate: 1.0
  final_exp_rate: .01
  final_exp_frame: 1_000
agent:
  initial_replay_size: 250
  max_replay_size: 10_000
  target_update_frequency: 300
  batch_size: 32
  n_features: 100
  loss_name: "mse_loss"
  learning_rate: !!float 3e-4
train:
  n_epochs: 100
  n_steps: 20_000
  test_samples: 10_000
  eval_policy_param: 0
  train_frequency: 1
