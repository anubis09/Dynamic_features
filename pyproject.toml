[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"

[project]
name = "dynamic_features"
version = "0.1.0"
description = "Thesis on automatic feature selection for classical RL algorithms"
readme = "README.md"
requires-python = "~=3.8.0"
dependencies = [
    "autorom[accept-rom-license]>=0.6.1",
    "gym[box2d]==0.25.2",
    "hydra-core>=1.3.2",
    "hydra-joblib-launcher>=1.2.0",
    "joblib>=1.4.2",
    "mushroom-rl>=1.10.1",
    "numpy>=1.24.4",
    "scikit-learn>=1.3.2",
    "torch>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pre-commit>=3.5.0",
    "wandb>=0.19.6",
    "pytest-benchmark>=4.0.0",
]

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning",]
addopts = "-s"
markers = [
    "benchmark: marks tests as benchmarks (deselect with '-m not benchmark')",
    "slow: marks tests as slow (deselect with '-m not slow')"
]

[tool.basedpyright]
typeCheckingMode = "standard"
include = ["src"]
ignore = ["**/__pycache__", ".venv"]
allowedUntypedLibraries = ["hydra","mushroom_rl", "torch"]

[tool.ruff]
line-length = 120
